        const STORAGE_KEY = "no_unlock_key";
        const REMEMBER_DEVICE = true;

        window.addEventListener('DOMContentLoaded', () => {
            if (!REMEMBER_DEVICE) return;
            const savedPass = localStorage.getItem(STORAGE_KEY);
            if (savedPass) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('loading-msg').style.display = 'block';
                setTimeout(() => unlock(savedPass), 100);
            }
        });

        function unlock(savedPass) {
            const passInput = document.getElementById('pass');
            const pass = (typeof savedPass === 'string') ? savedPass : passInput.value;
            const err = document.getElementById('error');
            try {
                const bytes = CryptoJS.AES.decrypt(payload, pass);
                const decryptedData = bytes.toString(CryptoJS.enc.Utf8);
                if (!decryptedData || !decryptedData.trim().startsWith('<')) {
                    throw new Error("Decryption failed");
                }
                if (REMEMBER_DEVICE) {
                    localStorage.setItem(STORAGE_KEY, pass);
                }
                document.open();
                document.write(decryptedData);
                document.close();
            } catch (e) {
                if (typeof savedPass === 'string') {
                    localStorage.removeItem(STORAGE_KEY);
                    document.getElementById('loading-msg').style.display = 'none';
                    document.getElementById('login-form').style.display = 'block';
                    document.getElementById('status-text').innerText = "Session Expired / Changed";
                }
                err.style.display = 'block';
                err.innerText = "Incorrect Password";
                const box = document.querySelector('.login-box');
                box.style.transform = 'translateX(10px)';
                setTimeout(() => box.style.transform = 'translateX(0)', 100);
            }
        }
    </script>
