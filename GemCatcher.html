<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HandTrack Arcade - Gem Catcher</title>
  <!-- Handtrack.js via jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/handtrackjs/dist/handtrack.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --accent: #58a6ff;
      --accent-green: #2ea043;
      --accent-red: #da3633;
      --text: #c9d1d9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 4px;
    }

    #status-text {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 500;
    }

    .main-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1200px;
    }

    .game-window {
      position: relative;
      background-color: #010409;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 320px;
    }

    .card {
      background: var(--panel);
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #ffffff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 6px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .stat-val {
      font-weight: bold;
      color: #ffffff;
    }

    .video-feed-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #30363d;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: var(--accent-green);
      color: #fff;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.1);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .instructions {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #8b949e;
    }

    .instructions ul {
      margin-left: 18px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>HandTrack Gem Catcher</h1>
    <div id="status-text">Click "Start Camera" to initialize the AI model.</div>
  </header>

  <div class="main-container">
    <div class="game-window">
      <canvas id="gameCanvas" width="640" height="480"></canvas>
    </div>

    <div class="sidebar">
      <div class="card">
        <button id="toggle-btn">Start Camera</button>
      </div>

      <div class="card">
        <h2>Live Statistics</h2>
        <div class="stat-row">
          <span>Score:</span>
          <span id="score" class="stat-val">0</span>
        </div>
        <div class="stat-row">
          <span>Lives:</span>
          <span id="lives" class="stat-val">❤️❤️❤️</span>
        </div>
        <div class="stat-row">
          <span>FPS:</span>
          <span id="fps" class="stat-val">0</span>
        </div>
      </div>

      <div class="card">
        <h2>Camera Monitor</h2>
        <div class="video-feed-wrapper">
          <video id="webcam" autoplay playsinline muted></video>
        </div>
      </div>

      <div class="card instructions">
        <strong>Controls:</strong>
        <ul>
          <li>Wave your hand horizontally to guide the paddle.</li>
          <li>Catch <strong>Cyan Gems</strong> (+10 pts) and <strong>Gold Stars</strong> (+25 pts).</li>
          <li>Avoid <strong>Red Hazard Bombs</strong> (-1 Life).</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("webcam");
    const toggleBtn = document.getElementById("toggle-btn");
    const statusText = document.getElementById("status-text");
    const scoreVal = document.getElementById("score");
    const livesVal = document.getElementById("lives");
    const fpsVal = document.getElementById("fps");

    // Audio synthesizer for feedback sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = "sine", duration = 0.1) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Model configuration
    const modelParams = {
      flipHorizontal: true,
      maxNumBoxes: 1,
      iouThreshold: 0.5,
      scoreThreshold: 0.65
    };

    let model = null;
    let isVideoRunning = false;
    let targetPaddleX = canvas.width / 2;
    let paddleX = canvas.width / 2;
    const paddleWidth = 100;
    const paddleHeight = 16;

    // Game state
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let items = [];
    let lastSpawn = 0;
    let spawnRate = 1200; // ms
    let lastFrameTime = performance.now();
    let frameCount = 0;
    let fpsTimer = performance.now();

    // Hand detection loop
    async function detectHands() {
      if (!isVideoRunning) return;

      try {
        const predictions = await model.detect(video);
        if (predictions.length > 0) {
          // Extract center X coordinate of the highest scoring box
          const bbox = predictions[0].bbox;
          const boxCenterX = bbox[0] + bbox[2] / 2;
          
          // Map camera coordinate proportionally to canvas dimensions
          const normX = boxCenterX / video.videoWidth;
          targetPaddleX = normX * canvas.width;
        }
      } catch (err) {
        console.error("Inference Error:", err);
      }

      if (isVideoRunning) {
        requestAnimationFrame(detectHands);
      }
    }

    // Item Spawner
    function spawnItem() {
      const types = [
        { type: "gem", color: "#00e5ff", points: 10, radius: 10, speed: 3 },
        { type: "star", color: "#ffd700", points: 25, radius: 12, speed: 4.5 },
        { type: "bomb", color: "#ff1744", points: 0, radius: 11, speed: 3.5 }
      ];

      const rand = Math.random();
      let chosen = types[0];
      if (rand > 0.8) chosen = types[1];
      else if (rand > 0.55) chosen = types[2];

      items.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: -10,
        ...chosen
      });
    }

    // Game rendering & physics loop
    function updateGame(now) {
      // FPS calculation
      frameCount++;
      if (now - fpsTimer >= 1000) {
        fpsVal.innerText = frameCount;
        frameCount = 0;
        fpsTimer = now;
      }

      // Clear screen
      ctx.fillStyle = "#05070a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Smooth paddle interpolation
      paddleX += (targetPaddleX - paddleX) * 0.2;
      const clampedX = Math.max(paddleWidth / 2, Math.min(canvas.width - paddleWidth / 2, paddleX));

      if (!gameOver) {
        // Spawning
        if (now - lastSpawn > spawnRate) {
          spawnItem();
          lastSpawn = now;
        }

        // Update items
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          item.y += item.speed;

          // Draw item
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
          ctx.fillStyle = item.color;
          ctx.shadowColor = item.color;
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;

          // Check paddle collision
          const paddleTop = canvas.height - 35;
          if (
            item.y + item.radius >= paddleTop &&
            item.y - item.radius <= paddleTop + paddleHeight &&
            item.x >= clampedX - paddleWidth / 2 &&
            item.x <= clampedX + paddleWidth / 2
          ) {
            if (item.type === "bomb") {
              lives--;
              playBeep(140, "sawtooth", 0.3);
              if (lives <= 0) gameOver = true;
            } else {
              score += item.points;
              playBeep(item.type === "star" ? 880 : 587, "sine", 0.1);
            }
            items.splice(i, 1);
            continue;
          }

          // Off-screen check
          if (item.y > canvas.height + 20) {
            items.splice(i, 1);
          }
        }

        // Update HUD display
        scoreVal.innerText = score;
        livesVal.innerText = "❤️".repeat(Math.max(0, lives));
      }

      // Draw Paddle
      ctx.fillStyle = "#58a6ff";
      ctx.shadowColor = "#58a6ff";
      ctx.shadowBlur = 12;
      ctx.fillRect(clampedX - paddleWidth / 2, canvas.height - 35, paddleWidth, paddleHeight);
      ctx.shadowBlur = 0;

      // Game Over Overlay
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "18px sans-serif";
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText("Click anywhere on canvas to restart", canvas.width / 2, canvas.height / 2 + 50);
      }

      requestAnimationFrame(updateGame);
    }

    // Restart game listener
    canvas.addEventListener("click", () => {
      if (gameOver) {
        score = 0;
        lives = 3;
        items = [];
        gameOver = false;
      }
    });

    // Toggle Camera and Tracking
    toggleBtn.addEventListener("click", async () => {
      if (!isVideoRunning) {
        toggleBtn.disabled = true;
        statusText.innerText = "Loading HandTrack model weights...";

        try {
          if (!model) {
            model = await handTrack.load(modelParams);
          }

          statusText.innerText = "Requesting camera access...";
          const status = await handTrack.startVideo(video);

          if (status) {
            isVideoRunning = true;
            toggleBtn.disabled = false;
            toggleBtn.innerText = "Stop Camera";
            toggleBtn.style.backgroundColor = "var(--accent-red)";
            statusText.innerText = "Tracking active: Wave your hand to move the paddle.";
            detectHands();
          } else {
            statusText.innerText = "Camera access denied or unavailable.";
            toggleBtn.disabled = false;
          }
        } catch (err) {
          console.error(err);
          statusText.innerText = "Failed to load model. Check browser console.";
          toggleBtn.disabled = false;
        }
      } else {
        handTrack.stopVideo(video);
        isVideoRunning = false;
        toggleBtn.innerText = "Start Camera";
        toggleBtn.style.backgroundColor = "var(--accent-green)";
        statusText.innerText = "Camera stopped.";
      }
    });

    // Start background game engine
    requestAnimationFrame(updateGame);
  </script>
</body>
</html>
