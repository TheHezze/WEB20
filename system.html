    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; background-color: #03050a;
            background-image:
                radial-gradient(circle at 50% 18%, #f59e0b26, transparent 48%),
                radial-gradient(circle at 85% 85%, rgba(30, 58, 138, 0.16), transparent 45%),
                linear-gradient(180deg, #03050a 0%, #070b14 100%);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #f8fafc;
        }
        .login-box {
            position: relative;
            background: linear-gradient(165deg, rgba(16, 25, 46, 0.96) 0%, rgba(8, 12, 23, 0.98) 100%);
            border: 1px solid #f59e0b88;
            padding: 2.5rem 2.2rem; border-radius: 20px;
            width: 100%; max-width: 455px; text-align: center;
            box-shadow: 0 28px 65px rgba(0,0,0,0.88), 0 0 36px #f59e0b1f, inset 0 0 0 1px rgba(255,251,235,0.06);
            backdrop-filter: blur(14px);
            transition: transform 0.14s ease;
            overflow: hidden;
        }
        .login-box::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #f59e0b, #fef08a, #f59e0b, transparent);
        }
        .logo-wrap { margin-bottom: 1.25rem; display: flex; justify-content: center; align-items: center; border-radius: 14px; transition: all 0.2s ease; }
        .logo-wrap.pedestal-light { background: rgba(255, 253, 245, 0.93); border: 1px solid #f59e0b; padding: 12px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
        .logo-wrap.pedestal-obsidian { background: radial-gradient(circle at 50% 50%, #f59e0b22, rgba(5, 8, 17, 0.94)); border: 1px solid #f59e0b88; padding: 12px 16px; box-shadow: inset 0 0 18px #f59e0b1f; }
        .logo-wrap.pedestal-gold-ring { background: radial-gradient(circle at 50% 50%, #f59e0b2e, rgba(5, 8, 17, 0.96)); border: 2px solid #f59e0b; padding: 12px 16px; box-shadow: 0 0 24px #f59e0b40, inset 0 0 12px #f59e0b26; }
        .builtin-sym-slot, .builtin-full-slot, .client-logo-slot { display: flex; align-items: center; justify-content: center; }
        .builtin-sym-slot svg, .builtin-sym-slot img { height: 96px; max-height: 96px; width: auto; max-width: 220px; object-fit: contain; overflow: visible; display: block; margin: 0 auto; }
        .builtin-full-slot svg, .builtin-full-slot img { height: 120px; max-height: 120px; width: auto; max-width: 280px; object-fit: contain; overflow: visible; display: block; margin: 0 auto; }
        .client-logo-slot img { height: 96px; max-height: 96px; max-width: 220px; width: auto; object-fit: contain; display: block; margin: 0 auto; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45)); }
        /* Co-Branded Split Header */
        .logo-wrap.cobrand-split { gap: 15px; padding: 11px 15px; background: rgba(4, 7, 15, 0.55); border: 1px solid #f59e0b38; }
        .logo-wrap.cobrand-split.pedestal-light { background: rgba(255, 253, 245, 0.93); border-color: #f59e0b; }
        .logo-wrap.cobrand-split .client-logo-slot img { height: 79px; max-height: 79px; max-width: 150px; }
        .logo-wrap.cobrand-split .builtin-sym-slot svg, .logo-wrap.cobrand-split .builtin-sym-slot img { height: 75px; max-height: 75px; max-width: 125px; }
        .logo-wrap.cobrand-split .builtin-full-slot svg, .logo-wrap.cobrand-split .builtin-full-slot img { height: 88px; max-height: 88px; max-width: 170px; }
        .cobrand-divider { position: relative; width: 1px; height: 56px; background: linear-gradient(180deg, transparent, #f59e0bcc, transparent); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .cobrand-diamond { font-size: 0.6rem; color: #f59e0b; background: #080d1a; padding: 2px; line-height: 1; border-radius: 99px; }
        /* Co-Branded Stacked Header */
        .logo-wrap.cobrand-stacked { flex-direction: column; gap: 12px; }
        .cobrand-sub-emblem { padding-top: 9px; border-top: 1px dashed #f59e0b55; width: 78%; display: flex; justify-content: center; }
        .cobrand-sub-emblem .builtin-sym-slot svg, .cobrand-sub-emblem .builtin-sym-slot img { height: 62px; max-height: 62px; }
        .cobrand-sub-emblem .builtin-full-slot svg, .cobrand-sub-emblem .builtin-full-slot img { height: 79px; max-height: 79px; }
        /* Footer Built-in Emblem */
        .footer-builtin-emblem { margin-bottom: 8px; display: flex; justify-content: center; }
        .footer-builtin-emblem .builtin-sym-slot svg, .footer-builtin-emblem .builtin-sym-slot img { height: 44px; max-height: 44px; width: auto; }
        .footer-builtin-emblem .builtin-full-slot svg, .footer-builtin-emblem .builtin-full-slot img { height: 64px; max-height: 64px; width: auto; }
        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.48rem; font-weight: 800; color: #f59e0b;
            margin-bottom: 0.35rem; letter-spacing: 0.02em;
            text-shadow: 0 2px 14px #f59e0b33;
        }

        const STORAGE_KEY = "wv_unlock_system_d3db";
        const REMEMBER_DEVICE = true;

        function b64ToBytes(b64) {
            const bin = atob(b64);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return arr;
        }
        function bytesToB64(bytes) {
            let bin = '';
            for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        }
        function launchDecryptedApp(decryptedHtml) {
            document.open();
            document.write(decryptedHtml);
            document.close();
            setTimeout(() => {
                try {
                    document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true, cancelable: true }));
                    window.dispatchEvent(new Event('load'));
                } catch (e) {}
            }, 25);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!REMEMBER_DEVICE) return;
            const savedRawKey = localStorage.getItem(STORAGE_KEY);
            if (savedRawKey) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('loading-msg').style.display = 'block';
                setTimeout(() => unlockWithSavedKey(savedRawKey), 60);
            }
        });

        async function unlockWithSavedKey(rawKeyB64) {
            try {
                const keyBytes = b64ToBytes(rawKeyB64);
                const aesKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
                const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(VAULT.iv) }, aesKey, b64ToBytes(VAULT.ct));
                const decrypted = new TextDecoder().decode(plainBuf);
                launchDecryptedApp(decrypted);
            } catch (e) {
                localStorage.removeItem(STORAGE_KEY);
                document.getElementById('loading-msg').style.display = 'none';
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('status-text').innerText = 'Session Expired / Password Updated';
            }
        }

        async function unlock() {
            const pass = document.getElementById('pass').value;
            const err = document.getElementById('error');
            err.style.display = 'none';
            try {
                const enc = new TextEncoder();
                const baseKey = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
                const aesKey = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: b64ToBytes(VAULT.s), iterations: VAULT.iter, hash: 'SHA-256' },
                    baseKey,
                    { name: 'AES-GCM', length: 256 },
                    true,
                    ['decrypt']
                );
                const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(VAULT.iv) }, aesKey, b64ToBytes(VAULT.ct));
                const decrypted = new TextDecoder().decode(plainBuf);
                if (REMEMBER_DEVICE) {
                    const exportedRaw = await crypto.subtle.exportKey('raw', aesKey);
                    localStorage.setItem(STORAGE_KEY, bytesToB64(new Uint8Array(exportedRaw)));
                }
                launchDecryptedApp(decrypted);
            } catch (e) {
                err.style.display = 'block';
                err.innerText = 'Incorrect Password';
                const box = document.querySelector('.login-box');
                box.style.transform = 'translateX(10px)';
                setTimeout(() => box.style.transform = 'translateX(-10px)', 80);
                setTimeout(() => box.style.transform = 'translateX(0)', 160);
            }
        }
